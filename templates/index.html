<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTDown</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">

    <header>
      <div class="header-top">
        <div class="logo">YTDown</div>
        <div id="version-badge" class="version-badge" title="yt-dlp version">
          <span id="version-dot" class="version-dot"></span>
          <span id="version-text">yt-dlp …</span>
        </div>
      </div>
      <p class="tagline">Téléchargez n'importe quel contenu vidéo ou audio</p>
    </header>

    <main>

      <!-- URL input -->
      <div class="input-row">
        <input
          type="text"
          id="url-input"
          placeholder="Colle un lien YouTube, TikTok, Instagram, SoundCloud..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="fetch-btn">
          <span id="btn-label">Analyser</span>
          <span id="btn-spinner" class="hidden">...</span>
        </button>
      </div>

      <!-- Auto-download toggle -->
      <label class="auto-dl-row">
        <input type="checkbox" id="auto-dl-chk" />
        <span>Télécharger automatiquement à la fin</span>
      </label>

      <!-- Error -->
      <div id="error-msg" class="error hidden"></div>

      <!-- ── Single video card ── -->
      <div id="video-card" class="card hidden">
        <div class="thumb-wrap">
          <img id="v-thumb" src="" alt="" />
          <span id="v-duration" class="badge"></span>
          <button id="thumb-btn" class="thumb-btn">↓ Miniature</button>
        </div>
        <div class="card-body">
          <div class="meta-top">
            <h2 id="v-title"></h2>
            <p class="meta-sub"><span id="v-channel"></span><span class="sep" id="v-views-sep">·</span><span id="v-views"></span></p>
          </div>

          <div class="label">Format</div>
          <div class="fmt-tabs" id="fmt-tabs">
            <button class="fmt-tab fmt-optimal active" data-fmt="best">Optimal</button>
            <button class="fmt-tab" data-fmt="mp4">MP4</button>
            <button class="fmt-tab" data-fmt="mkv">MKV</button>
            <button class="fmt-tab" data-fmt="mp3">MP3</button>
            <button class="fmt-tab" data-fmt="m4a">M4A</button>
          </div>

          <div class="label hidden" id="q-label">Qualité</div>

          <div class="q-grid hidden" id="q-video">
            <button class="q-btn" data-q="360">360p</button>
            <button class="q-btn" data-q="480">480p</button>
            <button class="q-btn" data-q="720">720p</button>
            <button class="q-btn" data-q="1080">1080p</button>
            <button class="q-btn" data-q="2k">2K</button>
            <button class="q-btn" data-q="4k">4K</button>
            <button class="q-btn" data-q="8k">8K</button>
          </div>
          <div class="q-grid hidden" id="q-audio">
            <button class="q-btn" data-q="128">128 kbps</button>
            <button class="q-btn active" data-q="256">256 kbps</button>
          </div>

          <button class="dl-btn" id="dl-btn">Télécharger</button>
        </div>
      </div>

      <!-- ── Playlist / channel card ── -->
      <div id="playlist-card" class="card hidden">
        <div class="thumb-wrap">
          <img id="p-thumb" src="" alt="" />
          <span class="badge badge-playlist" id="p-count"></span>
        </div>
        <div class="card-body">
          <div class="meta-top">
            <h2 id="p-title"></h2>
            <p class="meta-sub" id="p-channel"></p>
          </div>

          <div class="label">Format</div>
          <div class="fmt-tabs" id="p-fmt-tabs">
            <button class="fmt-tab fmt-optimal active" data-fmt="best">Optimal</button>
            <button class="fmt-tab" data-fmt="mp4">MP4</button>
            <button class="fmt-tab" data-fmt="mkv">MKV</button>
            <button class="fmt-tab" data-fmt="mp3">MP3</button>
            <button class="fmt-tab" data-fmt="m4a">M4A</button>
          </div>

          <div class="label hidden" id="pq-label">Qualité</div>

          <div class="q-grid hidden" id="pq-video">
            <button class="q-btn" data-q="360">360p</button>
            <button class="q-btn" data-q="480">480p</button>
            <button class="q-btn" data-q="720">720p</button>
            <button class="q-btn" data-q="1080">1080p</button>
            <button class="q-btn" data-q="2k">2K</button>
            <button class="q-btn" data-q="4k">4K</button>
            <button class="q-btn" data-q="8k">8K</button>
          </div>
          <div class="q-grid hidden" id="pq-audio">
            <button class="q-btn" data-q="128">128 kbps</button>
            <button class="q-btn active" data-q="256">256 kbps</button>
          </div>

          <button class="dl-btn" id="p-dl-btn">Tout télécharger</button>
        </div>
      </div>

      <!-- Progress -->
      <div id="progress-card" class="card hidden">
        <div class="prog-head">
          <span id="prog-label">Démarrage...</span>
          <span id="prog-pct">0%</span>
        </div>
        <div class="prog-track"><div id="prog-fill" class="prog-fill"></div></div>
        <div class="prog-meta">
          <span id="prog-speed"></span>
          <span id="prog-eta"></span>
          <span id="prog-current"></span>
        </div>
      </div>

      <!-- Done -->
      <div id="done-card" class="card done-card hidden">
        <span class="done-check">✓</span>
        <div class="done-info">
          <strong>Terminé</strong>
          <span id="done-name"></span>
        </div>
        <a href="#" id="save-link" class="save-btn">Sauvegarder</a>
      </div>

    </main>

    <!-- ── Services ── -->
    <footer>

</body>
</html>
