services:
  ytdown:
    build: .
    container_name: ytdown
    ports:
      - "8080:8080"
    volumes:
      # Les fichiers téléchargés survivent aux redémarrages
      - ./downloads:/app/downloads
      # Extensions, fournisseurs et configuration SpotiFLAC persistants
      - ./spotiflac:/root/.spotiflac
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SPOTIFLAC_REGISTRY=https://raw.githubusercontent.com/spotiflacapp/SpotiFLAC-Extension/main/registry.json
      - SPOTIFLAC_SERVICES=ext:tidal-web,ext:qobuz-web,ext:deezer,ext:amazon
